name: workflow-2

on:
  workflow_dispatch:

env:
  GREETING: "Hello"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Create a text file
      run: echo "${{ env.GREETING }} ${{ secrets.WORLD }}!" > hello.txt
    - uses: actions/upload-artifact@v7
      with:
        name: test-file
        path: hello.txt

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - uses: actions/download-artifact@v8
      with:
        name: test-file
    - name: List file
      run: ls
    - name: Test file
      run: cat hello.txt | grep -i "Hello World!"